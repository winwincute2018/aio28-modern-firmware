name: Auto Build Xiaozhi with Modern UI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.2
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Modern UI Files
        run: |
          mkdir -p main/display/lvgl_display/
          cp patch_files/modern_ui.h main/display/lvgl_display/
          cp patch_files/modern_ui.cpp main/display/lvgl_display/
          
      - name: Auto-Inject UI Code
        run: python patch_files/inject_ui.py

      - name: Configure and Build for custom_board_28aio
        run: |
          . $IDF_PATH/export.sh
          
          # Fix lỗi: The selected board does not define BOARD_DIR
          export BOARD=custom_board_28aio
          
          # Đặt target là esp32s3
          idf.py set-target esp32s3
          
          # Copy cấu hình chuẩn của board 28aio (nếu dự án có sẵn)
          if [ -f "configs/custom_board_28aio.conf" ]; then
             cp configs/custom_board_28aio.conf sdkconfig
          fi
          
          # Tiến hành build
          idf.py build

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-custom_board_28aio-modern-ui
          path: |
            build/xiaozhi.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
