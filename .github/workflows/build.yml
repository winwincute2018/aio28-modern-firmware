name: Build Firmware aio28-modern

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # cho phep chay thu cong tu GitHub UI
    inputs:
      server_url:
        description: 'URL máy chủ WebSocket (vd: ws://192.168.1.100:8080)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── 1. Lay ma nguon xiaozhi-esp32 ──────────────────────────────────
      - name: Checkout xiaozhi-esp32
        uses: actions/checkout@v4
        with:
          repository: 78/xiaozhi-esp32
          ref: main
          submodules: recursive
          path: xiaozhi-esp32

      # ── 2. Lay board tuy chinh cua ban ─────────────────────────────────
      - name: Checkout board aio28-modern
        uses: actions/checkout@v4
        with:
          path: my-board

      # ── 3. Copy board vao dung vi tri ──────────────────────────────────
      - name: Copy board files
        run: |
          cp -r my-board/main/boards/aio28-modern \
                xiaozhi-esp32/main/boards/aio28-modern

      # ── 4. Patch Kconfig: dang ky board moi ────────────────────────────
      - name: Patch Kconfig.projbuild
        working-directory: xiaozhi-esp32
        run: |
          # Chen vao sau dong "choice BOARD_TYPE"
          sed -i '/^choice BOARD_TYPE$/a\
          \
              config BOARD_TYPE_AIO28_MODERN\
                  bool "AIDEEPEN ES3C28P 2.8 Modern UI"\
                  depends on IDF_TARGET_ESP32S3' \
            main/Kconfig.projbuild

      # ── 5. Patch CMakeLists.txt: them branch board moi ─────────────────
      - name: Patch CMakeLists.txt
        working-directory: xiaozhi-esp32
        run: |
          # Chen truoc dong "else()" cuoi cung trong khoi board
          sed -i '/^else()$/i\
          elseif(CONFIG_BOARD_TYPE_AIO28_MODERN)\
              set(BOARD_DIR "aio28-modern")\
              set(BUILTIN_TEXT_FONT font_puhui_basic_14_1)\
              set(BUILTIN_ICON_FONT font_awesome_14_1)\
              set(DEFAULT_EMOJI_COLLECTION twemoji_32)' \
            main/CMakeLists.txt

      # ── 6. Dien URL may chu neu duoc truyen vao ─────────────────────────
      - name: Set custom server URL
        if: ${{ github.event.inputs.server_url != '' }}
        working-directory: xiaozhi-esp32
        run: |
          echo "CONFIG_WEBSOCKET_URL=\"${{ github.event.inputs.server_url }}\"" \
            >> sdkconfig.defaults

      # ── 7. Cai ESP-IDF v5.5 (cache de lan sau nhanh hon) ───────────────
      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/esp-idf
          key: esp-idf-v5.5-${{ runner.os }}

      - name: Install ESP-IDF v5.5
        run: |
          if [ ! -f ~/esp-idf/export.sh ]; then
            git clone --depth 1 --branch v5.5 \
              --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          fi
          ~/esp-idf/install.sh esp32s3

      # ── 8. Cache managed_components ─────────────────────────────────────
      - name: Cache IDF components
        uses: actions/cache@v4
        with:
          path: xiaozhi-esp32/managed_components
          key: idf-components-${{ hashFiles('xiaozhi-esp32/main/idf_component.yml') }}

      # ── 9. Build ─────────────────────────────────────────────────────────
      - name: Build firmware
        working-directory: xiaozhi-esp32
        run: |
          source ~/esp-idf/export.sh
          idf.py set-target esp32s3
          # Chon board + ngon ngu tieng Viet
          python scripts/build.py aio28-modern --language vi-VN || \
          ( \
            idf.py reconfigure \
              -DSDKCONFIG_DEFAULTS="sdkconfig.defaults" \
              -DCONFIG_BOARD_TYPE_AIO28_MODERN=y && \
            idf.py build \
          )

      # ── 10. Kiem tra file dau ra ─────────────────────────────────────────
      - name: Find output binary
        working-directory: xiaozhi-esp32
        run: |
          ls -lh build/merged-binary.bin 2>/dev/null || \
          ls -lh build/*.bin | head -5

      # ── 11. Upload artifact (tai xuong tu GitHub UI) ─────────────────────
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-aio28-modern-${{ github.run_number }}
          path: |
            xiaozhi-esp32/build/merged-binary.bin
            xiaozhi-esp32/build/bootloader/bootloader.bin
            xiaozhi-esp32/build/partition_table/partition-table.bin
          retention-days: 30
          if-no-files-found: error
